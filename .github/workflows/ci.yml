name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each lane job below invokes `node bin/verify.mjs --group <name>`, naming
  # one of the five fixed groups from bin/lib/verify-steps.mjs. This is the
  # whole parity guarantee: the local `lefthook.yml` pre-push lanes and every
  # job here read the same step list by group, so a step -- core or
  # pack-contributed -- can never run in one place and not the other.
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group build

  test:
    name: Test (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group test

  # Not a `verify.mjs` group: this lane reads the live GitHub repository, so it
  # needs the network and a token, which a local `pnpm verify` and the pre-push
  # lanes should not.
  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      # org policy, not something `claude plugin validate` checks: `description`
      # equals the GitHub repository description, and `keywords`, if set, equal
      # its topics. The script is the org's verbatim starter
      # (blueprint/files/check-plugin-metadata.mjs in monte3l/.github). It sits
      # in tools/ci/ and not in bin/, because a plugin's top-level bin/ goes on
      # the PATH of every user's Bash tool. A change to the description or the
      # topics is made on GitHub first.
      - name: Plugin metadata matches the GitHub repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/check-plugin-metadata.mjs

  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, build, test, plugin]
    if: always()
    timeout-minutes: 5
    steps:
      # Testing only for 'failure' is a hole: a lane that was cancelled or
      # skipped is not a failure, so it would pass and this job would report
      # green over a run that never finished. Require an explicit success
      # from every lane instead, so anything else fails closed.
      - name: Check lane results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lane results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required lane did not succeed: $RESULTS" >&2
              exit 1
            fi
          done
