schema_version: "1.1"
name: assess-trigger
description: Natural phrasing reaches the assess skill.
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Skill, Agent]
  prompt: "I know MCP really well, so skip the basics."
graders:
  - name: skill-fired
    type: tool_used
    arm: with-only
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?assess"'
