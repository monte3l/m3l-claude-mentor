schema_version: "1.1"
name: exam-grounding-dispatches-docs-researcher
description: The exam skill grounds a question in live docs through the docs-researcher agent before the key is fixed. Needs a Bash grant.
tags: [needs-bash]
runs: 3
execution:
  max_turns: 14
  allowed_tools: [Skill, Agent]
  prompt: "Use the exam skill: CCAR-F drill, domain D2, one question please."
graders:
  - name: dispatched
    type: tool_used
    arm: with-only
    tool: Agent
    input_match: "docs-researcher"
  - name: docs-before-key
    type: tool_order
    before:
      tool: Agent
      input_match: "docs-researcher"
    after:
      tool: Bash
      input_match: "exam-begin"
